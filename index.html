<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hishab Khata - Global Smart Personal Finance & Multi-Currency SaaS</title>
    <meta name="description" content="Hishab Khata is a modern, global personal-finance management SaaS for managing income, expenses, multi-currency wallets, budgets, loans, and smart financial insights." />
    <meta property="og:title" content="Hishab Khata - Global Smart Personal Finance & Multi-Currency SaaS" />
    <meta property="og:description" content="Track income, expenses, wallets, budgets, savings goals, and get smart financial insights with multi-currency and 15+ language support." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HishabKhata" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #F8FAFC;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      .hk-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(13, 148, 136, 0.2);
        border-top-color: #14B8A6;
        border-radius: 50%;
        animation: hk-spin 0.9s linear infinite;
      }
      @keyframes hk-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-teal-500 selection:text-white">
    <div id="root">
      <!-- Instant Bootstrapping Splash Screen (replaced once React mounts) -->
      <div id="initial-loader">
        <div style="text-align: center; max-width: 320px; padding: 24px;">
          <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(135deg, #0D9488 0%, #042F2E 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);">
            <svg width="36" height="36" viewBox="0 0 120 120" fill="none">
              <path d="M26 34C26 31 29 28 32 29L58 36V88L32 82C28 81 26 78 26 74V34Z" fill="#FFFFFF" fill-opacity="0.95"/>
              <path d="M94 34C94 31 91 28 88 29L62 36V88L88 82C92 81 94 78 94 74V34Z" fill="#F1F5F9" fill-opacity="0.9"/>
              <line x1="60" y1="34" x2="60" y2="89" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="60" cy="30" r="12" fill="#F59E0B"/>
            </svg>
          </div>
          <h2 style="font-size: 18px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; color: #FFFFFF;">
            Hishab<span style="color: #2DD4BF;">Khata</span>
          </h2>
          <p style="font-size: 12px; color: #94A3B8; margin: 0 0 20px;">
            হিসাব খাতা • Loading Smart Finance...
          </p>
          <div class="hk-spinner" style="margin: 0 auto;"></div>

          <!-- Auto-fallback helper if loading is blocked or service-worker stale -->
          <div id="loader-fallback" style="display: none; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
            <p style="font-size: 11px; color: #94A3B8; margin-bottom: 10px;">Taking longer than expected?</p>
            <button onclick="localStorage.clear(); if('caches' in window){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c)))).finally(()=>window.location.reload(true))}else{window.location.reload(true)}" style="font-size: 11px; font-weight: 700; color: #2DD4BF; background: rgba(13,148,136,0.2); border: 1px solid #0D9488; padding: 6px 14px; border-radius: 8px; cursor: pointer;">
              Reset Cache & Reload
            </button>
          </div>
        </div>
        <script>
          setTimeout(function() {
            var el = document.getElementById('loader-fallback');
            if (el) el.style.display = 'block';
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
