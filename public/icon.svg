<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  
  <!-- Subtle decorative inner border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
  
  <!-- Wallet Icon Graphic with shadow -->
  <g filter="url(#shadow)" transform="translate(106, 116)">
    <!-- Main Wallet Body -->
    <rect x="10" y="50" width="280" height="200" rx="32" fill="#ffffff" />
    <!-- Top Flap / Pocket -->
    <path d="M 10 90 L 10 60 C 10 40, 26 24, 46 24 L 254 24 C 274 24, 290 40, 290 60 L 290 90 Z" fill="#e2e8f0" />
    <!-- Top accent line -->
    <rect x="40" y="38" width="80" height="8" rx="4" fill="#0d9488" />
    <!-- Wallet Lock / Badge -->
    <rect x="190" y="115" width="105" height="70" rx="20" fill="url(#goldGrad)" />
    <!-- Coin inside badge -->
    <circle cx="242" cy="150" r="14" fill="#ffffff" />
    <circle cx="242" cy="150" r="8" fill="#d97706" />
    <!-- Upward Trend Arrow -->
    <path d="M 50 190 L 100 140 L 130 170 L 175 125" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 150 125 L 175 125 L 175 150" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
