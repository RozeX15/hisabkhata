<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" flood-color="#042f2e"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle corners -->
  <rect width="512" height="512" rx="120" fill="url(#brandGrad)" />
  
  <!-- Subtle decorative inner border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />

  <!-- Open Accounting Ledger Book (খাতা) Graphic -->
  <g filter="url(#shadow)">
    <!-- Left Ledger Page -->
    <path d="M 110 144 C 110 130, 122 118, 136 122 L 246 152 L 246 374 L 136 348 C 122 344, 110 332, 110 316 Z" fill="#ffffff" fill-opacity="0.96" />
    
    <!-- Right Ledger Page -->
    <path d="M 402 144 C 402 130, 390 118, 376 122 L 266 152 L 266 374 L 376 348 C 390 344, 402 332, 402 316 Z" fill="#f1f5f9" fill-opacity="0.92" />

    <!-- Center Spine Divider -->
    <line x1="256" y1="144" x2="256" y2="378" stroke="#0f766e" stroke-width="14" stroke-linecap="round" />

    <!-- Accounting Ledger Lines on Left Page -->
    <line x1="140" y1="184" x2="220" y2="200" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <line x1="140" y1="228" x2="220" y2="244" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <line x1="140" y1="272" x2="204" y2="284" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />

    <!-- Dynamic Growth Bars on Right Page -->
    <rect x="290" y="254" width="18" height="68" rx="8" fill="#0d9488" />
    <rect x="320" y="220" width="18" height="102" rx="8" fill="#0f766e" />
    <rect x="350" y="186" width="18" height="136" rx="8" fill="#14b8a6" />

    <!-- Upward Trend Arrow Across Pages -->
    <path d="M 144 300 L 212 236 L 280 270 L 366 170" fill="none" stroke="url(#growthGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 334 170 L 366 170 L 366 202" fill="none" stroke="url(#growthGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Radiant Golden Wealth Coin / Taka-Dollar Center Node -->
    <circle cx="256" cy="128" r="54" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="8" />
    <circle cx="256" cy="128" r="38" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="8 6" />
    <!-- Center Currency Emblem Symbol -->
    <path d="M 256 100 L 256 156 M 240 112 L 268 112 C 274 112, 278 116, 278 122 C 278 128, 274 132, 268 132 L 240 132 L 270 132 C 276 132, 280 136, 280 142 C 280 148, 276 152, 270 152 L 238 152" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
